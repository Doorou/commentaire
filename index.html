<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commentaires — Ezrarchives</title>
<style>
  :root {
    --accent: #DE287C;
    --card-bg: rgba(255, 255, 255, 0.95);
    --ink: #201A1A;
    --ink-soft: #6b5f63;
    --line: #f0d9e3;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--ink);
  }

  .comments-panel {
    height: 100%;
    background: var(--card-bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .comments-header {
    font-weight: bold;
    font-size: 16px;
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  /* On scrolle DANS cette zone, jamais en dehors de la boîte */
  .comments-list {
    overflow-y: auto;
    padding: 6px 16px;
    flex: 1;
    min-height: 80px;
  }

  .comment-item {
    display: flex;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .comment-item:last-child { border-bottom: none; }

  .comment-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--line);
  }

  .comment-body { min-width: 0; flex: 1; }

  .comment-top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 2px 8px;
    margin-bottom: 3px;
  }

  .comment-name {
    font-size: 15px;
    font-weight: bold;
    color: var(--accent);
    word-wrap: break-word;
  }

  .comment-date {
    font-size: 11px;
    color: var(--ink-soft);
  }

  .comment-text {
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .comments-empty {
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
    padding: 20px 8px;
  }

  /* --- Formulaire --- */
  .comment-form {
    flex-shrink: 0;
    border-top: 1px solid var(--line);
    padding: 12px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #fff;
  }

  .field-label {
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: -2px;
  }

  .avatar-picker {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .avatar-option {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    cursor: pointer;
    border: 3px solid transparent;
    opacity: 0.55;
    transition: opacity 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .avatar-option:hover { opacity: 0.9; transform: scale(1.05); }
  .avatar-option.selected {
    opacity: 1;
    border-color: var(--accent);
  }

  .color-picker {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }

  .color-swatch {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px var(--line);
    cursor: pointer;
    padding: 0;
  }
  .color-swatch.selected {
    box-shadow: 0 0 0 2px var(--ink);
  }

  .color-custom {
    width: 28px;
    height: 28px;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
  }

  .comment-form input[type="text"],
  .comment-form textarea {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    resize: none;
    background: #ffffff;
    color: var(--ink);
  }
  .comment-form input[type="text"] { font-weight: bold; }
  .comment-form textarea { min-height: 54px; }

  .comment-form button[type="submit"] {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  .comment-form button[type="submit"]:disabled { opacity: 0.5; cursor: default; }

  .comment-status {
    margin: 0;
    font-size: 12px;
    color: var(--ink-soft);
    min-height: 14px;
  }
</style>
</head>
<body>

<div class="comments-panel">
  <div class="comments-header">💬 Commentaires</div>

  <div class="comments-list" id="commentsList">
    <p class="comments-empty">Chargement des commentaires…</p>
  </div>

  <form class="comment-form" id="commentForm">
    <div class="field-label">Ton avatar</div>
    <div class="avatar-picker" id="avatarPicker"></div>

    <div class="field-label">Couleur de ton pseudo</div>
    <div class="color-picker" id="colorPicker"></div>

    <input type="text" id="commentName" placeholder="Ton prénom / pseudo" maxlength="40" required>
    <textarea id="commentMessage" placeholder="Écris ton commentaire..." maxlength="500" required></textarea>
    <button type="submit" id="commentSubmit">Poster</button>
    <p class="comment-status" id="commentStatus"></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://ynucsbhmipuluzkxvvue.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_AnA7LeZfs39cRWhBIra8OQ_udSJD9IU';

  // Tes avatars (liens File Garden)
  const avatarOptions = [
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/Triceratops_White.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/sorciere.png',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/rat.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/raton.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/poulpy.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/cat.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/panthere.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/meyra.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/caillou.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/tomate.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/soleil.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/lune.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/grasshopper.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/foug%C3%A8re.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/coccinelle.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/arti.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/pandajpg.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/starlight%20glimmer.png',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/lapin.png',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/hyene.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/geai%20des%20chenes.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/escargot.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/engin.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/Dracaufeu-RFVF.png',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/coussinet.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/chien.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/champi.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/carapuce.jpg',
    'https://file.garden/aqhkDYVXU6gQXMU7/avatar/baleine-bosse.jpg'
  ];

  // Couleurs proposées pour les pseudos (en plus du sélecteur libre)
  const colorOptions = [
    '#DE287C', '#E8590C', '#C49A00', '#2F9E44',
    '#1C7ED6', '#7048E8', '#AE3EC9', '#201A1A'
  ];

  let selectedAvatar = avatarOptions[0];
  let selectedColor = colorOptions[0];
  let supabaseClient = null;

  try {
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  } catch (e) {
    console.error('Supabase non configuré correctement :', e);
  }

  const commentsListEl = document.getElementById('commentsList');
  const commentFormEl = document.getElementById('commentForm');
  const commentNameEl = document.getElementById('commentName');
  const commentMessageEl = document.getElementById('commentMessage');
  const commentSubmitEl = document.getElementById('commentSubmit');
  const commentStatusEl = document.getElementById('commentStatus');
  const avatarPickerEl = document.getElementById('avatarPicker');
  const colorPickerEl = document.getElementById('colorPicker');

  // N'accepte qu'une couleur du type #aabbcc (évite tout contenu étrange)
  function safeColor(c) {
    return /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : '#DE287C';
  }

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString('fr-FR', {
      day: 'numeric', month: 'long', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function renderAvatarPicker() {
    avatarPickerEl.innerHTML = '';
    avatarOptions.forEach(url => {
      const img = document.createElement('img');
      img.src = url;
      img.className = 'avatar-option' + (url === selectedAvatar ? ' selected' : '');
      img.alt = 'avatar';
      img.addEventListener('click', () => {
        selectedAvatar = url;
        renderAvatarPicker();
      });
      avatarPickerEl.appendChild(img);
    });
  }

  function renderColorPicker() {
    colorPickerEl.innerHTML = '';
    colorOptions.forEach(color => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'color-swatch' + (color.toLowerCase() === selectedColor.toLowerCase() ? ' selected' : '');
      btn.style.background = color;
      btn.setAttribute('aria-label', 'Couleur ' + color);
      btn.addEventListener('click', () => {
        selectedColor = color;
        renderColorPicker();
      });
      colorPickerEl.appendChild(btn);
    });

    const custom = document.createElement('input');
    custom.type = 'color';
    custom.className = 'color-custom';
    custom.value = safeColor(selectedColor);
    custom.title = 'Autre couleur';
    custom.addEventListener('input', () => {
      selectedColor = custom.value;
      // on met à jour l'aperçu sans reconstruire (sinon le sélecteur se ferme)
      colorPickerEl.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
      commentNameEl.style.color = selectedColor;
    });
    colorPickerEl.appendChild(custom);

    // Le champ pseudo s'affiche dans la couleur choisie
    commentNameEl.style.color = selectedColor;
  }

  function renderComments(comments) {
    commentsListEl.innerHTML = '';
    if (!comments || comments.length === 0) {
      commentsListEl.innerHTML = '<p class="comments-empty">Aucun commentaire pour l\'instant. Sois le premier !</p>';
      return;
    }
    comments.forEach(c => {
      const item = document.createElement('div');
      item.className = 'comment-item';

      const avatar = document.createElement('img');
      avatar.className = 'comment-avatar';
      avatar.src = c.avatar_url;
      avatar.alt = '';

      const body = document.createElement('div');
      body.className = 'comment-body';

      const top = document.createElement('div');
      top.className = 'comment-top';

      const name = document.createElement('span');
      name.className = 'comment-name';
      name.textContent = c.name;
      name.style.color = safeColor(c.name_color);

      const date = document.createElement('span');
      date.className = 'comment-date';
      date.textContent = formatDate(c.created_at);

      const text = document.createElement('div');
      text.className = 'comment-text';
      text.textContent = c.message;

      top.appendChild(name);
      top.appendChild(date);
      body.appendChild(top);
      body.appendChild(text);
      item.appendChild(avatar);
      item.appendChild(body);
      commentsListEl.appendChild(item);
    });
  }

  async function fetchComments() {
    if (!supabaseClient) {
      commentsListEl.innerHTML = '<p class="comments-empty">Espace commentaires indisponible.</p>';
      return;
    }
    const { data: comments, error } = await supabaseClient
      .from('comments')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error(error);
      commentsListEl.innerHTML = '<p class="comments-empty">Impossible de charger les commentaires : ' + error.message + '</p>';
      return;
    }
    renderComments(comments);
  }

  async function postComment(name, message, avatarUrl, color) {
    const { error } = await supabaseClient
      .from('comments')
      .insert({ name, message, avatar_url: avatarUrl, name_color: safeColor(color) });
    if (error) throw error;
  }

  commentFormEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = commentNameEl.value.trim();
    const message = commentMessageEl.value.trim();
    if (!name || !message) return;

    if (!supabaseClient) {
      commentStatusEl.textContent = "L'espace commentaires est indisponible.";
      return;
    }

    commentSubmitEl.disabled = true;
    commentStatusEl.textContent = 'Envoi...';

    try {
      await postComment(name, message, selectedAvatar, selectedColor);
      commentMessageEl.value = '';
      commentStatusEl.textContent = 'Commentaire publié !';
      await fetchComments();
    } catch (err) {
      console.error(err);
      commentStatusEl.textContent = "Erreur : " + (err && err.message ? err.message : "réessaie.");
    } finally {
      commentSubmitEl.disabled = false;
      setTimeout(() => { commentStatusEl.textContent = ''; }, 6000);
    }
  });

  renderAvatarPicker();
  renderColorPicker();
  fetchComments();
</script>

</body>
</html>
